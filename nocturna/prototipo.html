<!doctype html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Rueda Nocturna: descubre Medellín en bici cuando se encienden las luces.">
    <title>Rueda Nocturna | Rueda Libre</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="min-h-screen bg-[#101b24] font-sans text-[#f7f4ec]">
    <main class="mx-auto flex min-h-screen w-full max-w-7xl items-center px-6 py-10 sm:px-10 lg:px-16">
        <section class="grid w-full items-center gap-10 lg:grid-cols-2 lg:gap-16" aria-labelledby="titulo-campana">
            <div class="space-y-8">
                <a href="../index.html" class="inline-flex items-center gap-3 text-sm font-bold tracking-[0.22em] text-[#c4d0ca] uppercase">
                    <span class="h-px w-8 bg-[#e4b86b]"></span>
                    Rueda Libre
                </a>

                <div class="space-y-5">
                    <p class="inline-flex rounded-full border border-[#e4b86b]/50 bg-[#e4b86b]/10 px-4 py-2 text-xs font-bold tracking-[0.18em] text-[#f0c77e] uppercase">
                        Nuevo · Jueves a sábado
                    </p>
                    <h1 id="titulo-campana" class="max-w-2xl text-5xl leading-[1.02] font-black tracking-tight sm:text-6xl lg:text-7xl">
                        Rueda <span class="text-[#e4b86b]">Nocturna</span>
                    </h1>
                    <p class="max-w-xl text-lg leading-8 text-[#c4d0ca] sm:text-xl">
                        Descubre Medellín en bici cuando se encienden las luces
                    </p>
                </div>

                <div class="flex max-w-md gap-10 border-y border-[#354650] py-5">
                    <div class="space-y-1">
                        <p class="text-3xl font-black tracking-tight text-[#f7f4ec]">3</p>
                        <p class="text-xs font-bold tracking-[0.18em] text-[#aabbb3] uppercase">Rutas</p>
                    </div>
                    <div class="h-14 w-px bg-[#354650]"></div>
                    <div class="space-y-1">
                        <p class="text-3xl font-black tracking-tight text-[#f7f4ec]">$55.000</p>
                        <p class="text-xs font-bold tracking-[0.18em] text-[#aabbb3] uppercase">Desde</p>
                    </div>
                </div>

                <div class="flex flex-col items-start gap-4 sm:flex-row sm:items-center">
                    <a href="../pages/reservas.html" class="inline-flex items-center justify-center rounded-full bg-[#e4b86b] px-8 py-4 text-sm font-extrabold tracking-wide text-[#14232c] hover:bg-[#f0ca8a] focus:outline-2 focus:outline-offset-4 focus:outline-[#e4b86b]">
                        Inscríbete
                        <span class="ml-3 text-lg" aria-hidden="true">↗</span>
                    </a>
                    <p class="max-w-xs text-sm leading-6 text-[#aabbb3]">Una ciudad distinta empieza después del atardecer.</p>
                </div>
            </div>

            <div class="relative mx-auto w-full max-w-xl">
                <div class="absolute -right-3 -bottom-3 h-full w-full rounded-[2rem] border border-[#e4b86b]/50 sm:-right-5 sm:-bottom-5"></div>
                <div class="relative overflow-hidden rounded-[2rem] bg-[#24343d]">
                    <img src="../img/rueda-nocturna.png" alt="Persona recorriendo Medellín de noche en una bicicleta deportiva" class="h-[27rem] w-full object-cover sm:h-[35rem]">
                    <div class="absolute inset-0 bg-gradient-to-t from-[#101b24]/75 via-transparent to-[#101b24]/5"></div>
                    <div class="absolute right-6 bottom-7 left-6 sm:right-8 sm:bottom-9 sm:left-8">
                        <p class="text-xs font-bold tracking-[0.25em] text-[#e4b86b] uppercase">Medellín se vive sobre ruedas</p>
                        <p class="mt-2 text-3xl font-black tracking-tight sm:text-4xl">La ciudad<br>después del sol.</p>
                    </div>
                </div>
            </div>
        </section>
    </main>
</body>
</html>
